<div class="grid gap-3 px-6 py-5 sm:grid-cols-3">
  <app-indicador etiqueta="Costo total" [valor]="costo() | cop" />
  <app-indicador etiqueta="Mantenimientos" [valor]="cantidad()" />
  <app-indicador etiqueta="Costo promedio" [valor]="(cantidad() ? costo() / cantidad() : 0) | cop" />
</div>

@if (filas().length) {
  <div class="overflow-x-auto">
    <table class="w-full min-w-[560px] text-left text-sm">
      <thead class="border-y border-black/5 bg-zinc-50 text-[10px] font-bold uppercase tracking-widest text-zinc-400">
        <tr>
          <th scope="col" class="px-6 py-3">Sede</th>
          <th scope="col" class="px-6 py-3">Tipo de equipo</th>
          <th scope="col" class="px-6 py-3 text-right">Mantenimientos</th>
          <th scope="col" class="px-6 py-3 text-right">Costo</th>
          <th scope="col" class="w-40 px-6 py-3"><span class="sr-only">Proporción</span></th>
        </tr>
      </thead>
      <tbody class="divide-y divide-black/5">
        @for (f of filas(); track f.idSede + f.tipo) {
          <tr>
            <td class="px-6 py-3 font-bold">{{ f.sede }}</td>
            <td class="px-6 py-3 text-zinc-600">{{ f.tipo }}</td>
            <td class="px-6 py-3 text-right tabular-nums">{{ f.numMantenimientos }}</td>
            <td class="px-6 py-3 text-right font-bold tabular-nums">{{ f.costoTotal | cop }}</td>
            <td class="px-6 py-3"><app-barra [valor]="f.costoTotal" [maximo]="maximo()" /></td>
          </tr>
        }
      </tbody>
    </table>
  </div>
} @else {
  <app-vacio mensaje="No hay mantenimientos en el rango elegido." detalle="Amplía las fechas o cambia la sede." />
}
