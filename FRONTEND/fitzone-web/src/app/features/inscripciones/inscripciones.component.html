<app-panel titulo="Inscripciones" descripcion="Elige una sesión para ver sus inscritos e inscribir miembros." [cargando]="cargando()">
  <div class="space-y-4 border-b border-black/5 px-6 py-5">
    <div>
      <label class="fz-label" for="ses">Sesión</label>
      <select id="ses" class="fz-input" [ngModel]="numero()" (ngModelChange)="elegir($event)">
        <option [ngValue]="0">Selecciona una sesión…</option>
        @for (s of sesiones(); track s.numeroSesion) {
          <option [ngValue]="s.numeroSesion">{{ s.clase }} · {{ s.fecha | fecha }} {{ s.horaInicio }} · {{ s.sede }} ({{ s.inscritos }}/{{ s.cupoMaximo }})</option>
        }
      </select>
    </div>
    @if (sesion(); as s) {
      <div class="flex flex-col gap-3 sm:flex-row sm:items-end">
        <div class="flex-1">
          <label class="fz-label" for="mie">Inscribir miembro ({{ s.sede }})</label>
          <select id="mie" class="fz-input" [ngModel]="idMiembro()" (ngModelChange)="idMiembro.set(+$event)">
            <option [ngValue]="0">Selecciona un miembro…</option>
            @for (m of candidatos(); track m.idMiembro) { <option [ngValue]="m.idMiembro">{{ m.nombreCompleto }}{{ m.planActual ? '' : ' (sin membresía)' }}</option> }
          </select>
        </div>
        <button type="button" class="fz-btn" [disabled]="enviando() || !idMiembro()" (click)="inscribir()">{{ enviando() ? 'Inscribiendo…' : 'Inscribir' }}</button>
      </div>
      @if (error()) { <p class="rounded-xl border border-red-500/20 bg-red-500/10 px-4 py-3 text-sm text-red-600">{{ error() }}</p> }
    }
  </div>
  @if (sesion()) {
    <div class="divide-y divide-black/5">
      @for (i of inscritos(); track i.idMiembro) {
        <app-fila [principal]="i.miembro" [secundario]="'Inscrito el ' + (i.fechaInscripcion | fecha)" [estado]="i.asistio ? 'asistió' : 'inscrito'" />
      } @empty { <app-vacio mensaje="Esta sesión aún no tiene inscritos." detalle="Inscribe al primer miembro arriba." /> }
    </div>
  } @else {
    <app-vacio mensaje="Selecciona una sesión." detalle="Verás aquí los miembros inscritos." />
  }
</app-panel>
