<div class="fixed inset-0 z-[60] grid place-items-center overflow-y-auto bg-black/50 p-4 backdrop-blur-sm" (click)="cerrar.emit()">
  <div class="my-8 w-full max-w-xl rounded-[1.5rem] bg-white p-6 shadow-2xl sm:p-8" (click)="$event.stopPropagation()" role="dialog" aria-modal="true">
    <div class="mb-6 flex items-start justify-between gap-4">
      <h3 class="text-xl font-black tracking-tight">{{ titulo() }}</h3>
      <button type="button" (click)="cerrar.emit()" class="grid size-9 place-items-center rounded-xl text-zinc-400 hover:bg-zinc-100" aria-label="Cerrar">
        <app-icon name="x" cls="size-5" />
      </button>
    </div>
    <ng-content />
  </div>
</div>
