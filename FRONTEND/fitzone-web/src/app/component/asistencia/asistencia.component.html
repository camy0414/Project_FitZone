<app-panel titulo="Asistencia" descripcion="Marca quién asistió a cada sesión." [cargando]="cargando()">
  <div class="border-b border-black/5 px-6 py-5">
    <label class="fz-label" for="ses">Sesión</label>
    <select id="ses" class="fz-input" [ngModel]="numero()" (ngModelChange)="elegir($event)">
      <option [ngValue]="0">Selecciona una sesión…</option>
      @for (s of disponibles(); track s.numeroSesion) {
        <option [ngValue]="s.numeroSesion">{{ s.clase }} · {{ s.fecha | fecha }} {{ s.horaInicio }} · {{ s.sede }}</option>
      }
    </select>
    @if (sesion()) { <p class="mt-2 text-xs font-bold text-zinc-500">{{ presentes() }} de {{ inscritos().length }} asistieron · {{ pendientes() }} sin registrar</p> }
  </div>
  @if (sesion()) {
    <div class="divide-y divide-black/5">
      @for (i of inscritos(); track i.idMiembro) {
        <app-fila [principal]="i.miembro" [secundario]="'Inscrito el ' + (i.fechaInscripcion | fecha)" [estado]="estado(i)">
          <div class="flex gap-2">
            <button type="button" [class]="i.asistio === true ? 'fz-btn' : 'fz-btn-ghost'" [attr.aria-pressed]="i.asistio === true" (click)="marcar(i, true)">Asistió</button>
            <button type="button" [class]="i.asistio === false ? 'fz-btn' : 'fz-btn-ghost'" [attr.aria-pressed]="i.asistio === false" (click)="marcar(i, false)">No asistió</button>
          </div>
        </app-fila>
      } @empty { <app-vacio mensaje="Esta sesión no tiene inscritos." detalle="" /> }
    </div>
  } @else {
    <app-vacio mensaje="Selecciona una sesión." detalle="Verás aquí la lista para marcar asistencia." />
  }
</app-panel>
