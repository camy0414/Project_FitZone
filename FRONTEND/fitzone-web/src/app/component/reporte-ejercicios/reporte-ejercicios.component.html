<div class="grid gap-3 px-6 py-5 sm:grid-cols-2">
  <app-indicador etiqueta="Ejercicios distintos" [valor]="filas().length" detalle="En rutinas activas" />
  <app-indicador etiqueta="El más asignado" [valor]="masUsado()" />
</div>

@if (filas().length) {
  @if (porTipo().length > 1) {
    <div class="flex flex-wrap gap-2 px-6 pb-4">
      @for (t of porTipo(); track t.tipo) {
        <span class="rounded-full bg-zinc-100 px-3 py-1 text-xs font-bold capitalize text-zinc-600">{{ t.tipo }}: {{ t.cantidad }}</span>
      }
    </div>
  }
  <div class="overflow-x-auto">
    <table class="w-full min-w-[520px] text-left text-sm">
      <thead class="border-y border-black/5 bg-zinc-50 text-[10px] font-bold uppercase tracking-widest text-zinc-400">
        <tr>
          <th scope="col" class="px-6 py-3">Ejercicio</th>
          <th scope="col" class="px-6 py-3">Tipo</th>
          <th scope="col" class="px-6 py-3 text-right">Rutinas</th>
          <th scope="col" class="w-40 px-6 py-3"><span class="sr-only">Proporción</span></th>
        </tr>
      </thead>
      <tbody class="divide-y divide-black/5">
        @for (f of pag.items(); track f.nombre) {
          <tr>
            <td class="px-6 py-3 font-bold">{{ f.nombre }}</td>
            <td class="px-6 py-3 capitalize text-zinc-600">{{ f.tipo }}</td>
            <td class="px-6 py-3 text-right tabular-nums">{{ f.rutinas }}</td>
            <td class="px-6 py-3"><app-barra [valor]="f.rutinas" [maximo]="maximo()" /></td>
          </tr>
        }
      </tbody>
    </table>
  </div>
  <app-paginador [pag]="pag" />
} @else {
  <app-vacio mensaje="No hay rutinas activas." detalle="Los ejercicios aparecen aquí cuando los entrenadores crean rutinas." />
}
