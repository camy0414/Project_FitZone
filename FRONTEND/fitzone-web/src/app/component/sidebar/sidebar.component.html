<aside
  class="fixed inset-y-0 left-0 z-50 flex w-72 flex-col bg-[#111112] text-white transition-transform duration-300 lg:translate-x-0"
  [class]="abierto() ? 'translate-x-0' : '-translate-x-full'"
>
  <div class="flex h-24 items-center justify-between px-7">
    <div class="flex items-center gap-3">
      <span class="grid size-11 place-items-center rounded-2xl bg-orange-500 text-black shadow-[0_0_28px_rgba(249,115,22,.22)]">
        <app-icon name="dumbbell" cls="size-6" [sw]="2.6" />
      </span>
      <div>
        <p class="text-xl font-black tracking-tight">FIT ZONE</p>
        <p class="text-[9px] font-bold tracking-[.25em] text-orange-400">CONTROL CENTER</p>
      </div>
    </div>
    <button type="button" class="grid size-9 place-items-center rounded-xl text-zinc-400 hover:bg-white/5 lg:hidden" (click)="cerrar.emit()" aria-label="Cerrar menú">
      <app-icon name="x" cls="size-5" />
    </button>
  </div>

  <div class="mx-5 mb-5 rounded-2xl border border-white/8 bg-white/[.04] p-3.5">
    <div class="flex items-center gap-3">
      <app-avatar [nombre]="usuario()?.nombre ?? ''" />
      <div class="min-w-0">
        <p class="truncate text-sm font-bold">{{ usuario()?.nombre }}</p>
        <p class="mt-0.5 text-xs text-zinc-500">{{ rolLabel() }}</p>
        <p class="text-[11px] text-orange-400">{{ sedeLabel() }}</p>
      </div>
    </div>
  </div>

  <nav class="flex-1 space-y-1 overflow-y-auto px-4">
    <p class="mb-3 px-3 text-[10px] font-bold uppercase tracking-[.2em] text-zinc-600">Operación</p>
    @for (item of menu(); track item.ruta) {
      <a
        [routerLink]="item.ruta"
        routerLinkActive="!bg-orange-500 !text-black shadow-lg shadow-orange-950/20"
        (click)="cerrar.emit()"
        class="group flex w-full items-center gap-3 rounded-xl px-3.5 py-3 text-sm font-semibold text-zinc-400 transition hover:bg-white/[.05] hover:text-white"
      >
        <app-icon [name]="item.icono" cls="size-[18px]" />
        <span class="flex-1 text-left">{{ item.etiqueta }}</span>
      </a>
    }
  </nav>

  <div class="space-y-1 border-t border-white/8 p-4">
    <button type="button" (click)="salir()" class="flex w-full items-center gap-3 rounded-xl px-3.5 py-3 text-sm font-semibold text-zinc-400 transition hover:bg-red-500/10 hover:text-red-400">
      <app-icon name="log-out" cls="size-[18px]" />
      Cerrar sesión
    </button>
  </div>
</aside>
