<section class="overflow-hidden rounded-[1.75rem] border border-black/5 bg-white">
  <div class="flex flex-col gap-4 border-b border-black/5 px-6 py-6 sm:flex-row sm:items-center sm:justify-between">
    <div>
      <h2 class="text-2xl font-black tracking-tight">{{ titulo() }}</h2>
      <p class="mt-1 text-sm text-zinc-400">{{ descripcion() }}</p>
    </div>
    <div class="flex items-center gap-2"><ng-content select="[acciones]" /></div>
  </div>
  @if (cargando()) {
    <p class="px-6 py-16 text-center text-sm font-semibold text-zinc-400">Cargando…</p>
  } @else {
    <ng-content />
  }
</section>
