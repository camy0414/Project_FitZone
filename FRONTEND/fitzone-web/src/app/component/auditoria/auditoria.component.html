<app-panel titulo="Auditoría" descripcion="Cambios registrados por la base de datos en pagos, membresías y empleados." [cargando]="cargando()">
  <div acciones class="flex gap-2">
    <select class="fz-input" aria-label="Tabla" [ngModel]="tabla()" (ngModelChange)="tabla.set($event)">
      <option value="">Todas las tablas</option>
      @for (t of tablas(); track t) { <option [value]="t">{{ t }}</option> }
    </select>
    <select class="fz-input" aria-label="Operación" [ngModel]="operacion()" (ngModelChange)="operacion.set($event)">
      <option value="">Todas las operaciones</option>
      @for (o of operaciones(); track o) { <option [value]="o">{{ accion(o) }}</option> }
    </select>
  </div>
  @if (error()) { <p class="m-6 rounded-xl border border-red-500/20 bg-red-500/10 px-4 py-3 text-sm text-red-600">{{ error() }}</p> }
  <div class="divide-y divide-black/5">
    @for (a of visibles(); track a.idAuditoria) {
      <app-fila
        [principal]="accion(a.operacion) + ' en ' + a.tabla + ' #' + a.idRegistro"
        [secundario]="(a.empleado ?? 'Sin empleado') + ' · ' + a.rolBd"
        [meta]="(a.fecha.slice(0, 10) | fecha: true) + ' · ' + hora(a.fecha)" />
    } @empty { <app-vacio mensaje="No hay cambios registrados." detalle="Prueba con otro filtro." /> }
  </div>
</app-panel>
