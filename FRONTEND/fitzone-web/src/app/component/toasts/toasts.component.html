<div class="pointer-events-none fixed bottom-5 right-5 z-[70] flex max-w-sm flex-col gap-2">
  @for (a of toast.avisos(); track a.id) {
    <div class="pointer-events-auto rounded-xl px-4 py-3 text-sm font-semibold shadow-xl"
         [class]="a.tipo === 'ok' ? 'bg-zinc-900 text-white' : 'bg-red-600 text-white'">
      {{ a.texto }}
    </div>
  }
</div>
