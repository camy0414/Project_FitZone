@if (pag().totalPaginas() > 1) {
  <nav class="flex flex-col items-center justify-between gap-3 border-t border-black/5 px-6 py-4 sm:flex-row" aria-label="Paginación">
    <p class="text-xs font-semibold text-zinc-400">Mostrando {{ desde() }}–{{ hasta() }} de {{ pag().totalRegistros() }}</p>
    <div class="flex items-center gap-1">
      <button type="button" class="fz-btn-ghost !px-3" [disabled]="pag().pagina() === 0" (click)="ir(pag().pagina() - 1)" aria-label="Página anterior">‹</button>
      @for (n of numeros(); track $index) {
        @if (n === null) {
          <span class="px-1 text-xs text-zinc-400">…</span>
        } @else {
          <button type="button" class="min-w-9 rounded-xl px-2.5 py-2 text-xs font-bold transition"
            [class]="n === pag().pagina() ? 'bg-orange-500 text-black' : 'text-zinc-500 hover:bg-zinc-100'"
            [attr.aria-current]="n === pag().pagina() ? 'page' : null" (click)="ir(n)">{{ n + 1 }}</button>
        }
      }
      <button type="button" class="fz-btn-ghost !px-3" [disabled]="pag().pagina() >= pag().totalPaginas() - 1" (click)="ir(pag().pagina() + 1)" aria-label="Página siguiente">›</button>
    </div>
  </nav>
}
