spring.application.name=backFitZone
server.port=8095


# PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/fitzoneDB
spring.datasource.username=fitzoneDB
spring.datasource.password=${DB_PASSWORD:123456}

# MongoDB
spring.mongodb.uri=mongodb://localhost:27017/fitzoneDB

# Configuración de Swagger
springdoc.swagger-ui.path=/swagger-ui.html
# Prevenir escape de HTML en la documentación de Swagger
springdoc.swagger-ui.docExpansion=none
springdoc.swagger-ui.syntaxHighlight.activated=true
springdoc.swagger-ui.syntaxHighlight.theme=markdown
springdoc.swagger-ui.displayRequestDuration=true
springdoc.swagger-ui.filter=true
springdoc.swagger-ui.tryItOutEnabled=true
springdoc.swagger-ui.supportedSubmitMethods=["get", "post", "put", "delete"]


# JWT (clave en Base64, minimo 32 bytes) y expiracion en ms (1 hora)
jwt.secret=bWktY2xhdmUtc3VwZXItc2VjcmV0YS1kZS1taW5pbW8tMzItYnl0ZXMtMTIzNDU2
fitzone.jwt.expiration=3600000
