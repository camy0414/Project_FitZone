spring.application.name=backFitZone
server.port=8095

# PostgreSQL
spring.datasource.url=jdbc:postgresql://192.168.56.13:5432/fitzoneDB
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD:postgres}

# MongoDB
spring.mongodb.uri=mongodb://admin:${MONGO_PASSWORD:mongo}@192.168.56.14:27017/fitzone_nosql?authSource=admin
fitzone.mongodb.database=fitzone_nosql

# Configuracion de Swagger
springdoc.swagger-ui.path=/swagger-ui.html
# Secciones colapsadas al abrir la documentacion de Swagger
springdoc.swagger-ui.docExpansion=none
springdoc.swagger-ui.syntaxHighlight.activated=true
springdoc.swagger-ui.syntaxHighlight.theme=monokai
springdoc.swagger-ui.displayRequestDuration=true
springdoc.swagger-ui.filter=true
springdoc.swagger-ui.tryItOutEnabled=true
springdoc.swagger-ui.supportedSubmitMethods=get,post,put,delete,patch


# JWT (clave en Base64, minimo 32 bytes) y tiempo de expiracion de un token (1 hora)
jwt.secret=bWktY2xhdmUtc3VwZXItc2VjcmV0YS1kZS1taW5pbW8tMzItYnl0ZXMtMTIzNDU2
jwt.expiration=3600000

# CORS:Origenes
fitzone.cors.origenes=http://localhost:4200,http://127.0.0.1:4200